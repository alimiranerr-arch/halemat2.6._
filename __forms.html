<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><title>Formlar</title><meta name="robots" content="noindex"></head>
<body>
<form name="geri-bildirim" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="geri-bildirim">
  <input name="bot-field">
  <input name="oyuncu">
  <input name="surum">
  <input name="tur">
  <textarea name="mesaj"></textarea>
</form>
<form name="ogretmen" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="ogretmen">
  <input name="bot-field">
  <input name="ad">
  <input type="email" name="email">
  <input type="tel" name="telefon">
  <input name="okul">
  <input name="sinif">
  <select name="iletisim"><option>E-posta</option><option>Telefon</option></select>
  <select name="talep"><option>Sınıf erişimi</option></select>
  <textarea name="mesaj"></textarea>
</form>
</body></html>
