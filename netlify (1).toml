headersOrigin = "config"
redirectsOrigin = "config"
plugins = []

[database]

  [database.migrations]
  path = "/opt/build/repo/netlify/database/migrations"

[build]
publish = "/opt/build/repo/public"
publishOrigin = "config"

  [build.environment]

  [build.processing]

    [build.processing.css]

    [build.processing.html]

    [build.processing.images]

    [build.processing.js]

  [build.services]

[functions]

  [functions."*"]

[[headers]]
for = "/sw.js"

  [headers.values]
  Cache-Control = "no-cache"
  Service-Worker-Allowed = "/"

[[headers]]
for = "/manifest.webmanifest"

  [headers.values]
  Content-Type = "application/manifest+json"

[[redirects]]
from = "/"
to = "/Hako/Presents"
status = 302
force = true

  [redirects.query]

  [redirects.conditions]

  [redirects.headers]

[[redirects]]
from = "/Hako/Presents"
to = "/index.html"
status = 200
force = false

  [redirects.query]

  [redirects.conditions]

  [redirects.headers]